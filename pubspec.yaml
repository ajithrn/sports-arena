name: sports_arena
description: "Sports Arena - Live Sports Streaming"
publish_to: 'none'
version: 1.5.0+14

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  http: ^1.2.0
  dio: ^5.7.0
  provider: ^6.1.0
  cached_network_image: ^3.3.0
  webview_flutter: ^4.10.0
  webview_flutter_android: ^4.3.0
  webview_flutter_wkwebview: ^3.16.0
  webview_win_floating: ^3.0.0
  window_manager: ^0.5.2
  url_launcher: ^6.3.1
  intl: ^0.20.3
  shimmer: ^3.0.0
  shared_preferences: ^2.3.0
  path_provider: ^2.1.5
  permission_handler: ^12.0.3
  open_filex: ^4.5.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.0

flutter_launcher_icons:
  android: true
  ios: false
  image_path: "assets/icon/app_icon.png"
  adaptive_icon_background: "#1A1A2E"
  adaptive_icon_foreground: "assets/icon/app_icon_foreground.png"
  macos:
    generate: true
    image_path: "assets/icon/app_icon.png"
  windows:
    generate: true
    image_path: "assets/icon/app_icon.png"
    icon_size: 256
  web:
    generate: true
    image_path: "assets/icon/app_icon.png"

flutter:
  uses-material-design: true
