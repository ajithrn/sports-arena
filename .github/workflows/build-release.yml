name: Build & Release APK

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.38.5'
          channel: 'stable'

      - name: Get dependencies
        run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - name: Get version from tag
        id: version
        run: echo "VERSION=${GITHUB_REF#refs/tags/}" >> $GITHUB_OUTPUT

      - name: Rename APK
        run: mv build/app/outputs/flutter-apk/app-release.apk build/app/outputs/flutter-apk/sports-arena-${{ steps.version.outputs.VERSION }}.apk

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          name: Sports Arena ${{ steps.version.outputs.VERSION }}
          body: |
            ## Sports Arena ${{ steps.version.outputs.VERSION }}
            
            ### Downloads
            - **Android (Phone + TV):** Download the APK below and sideload
            
            ### Install on Android TV / Fire Stick
            ```
            adb install sports-arena-${{ steps.version.outputs.VERSION }}.apk
            ```
          files: |
            build/app/outputs/flutter-apk/sports-arena-${{ steps.version.outputs.VERSION }}.apk
          draft: false
          prerelease: false
